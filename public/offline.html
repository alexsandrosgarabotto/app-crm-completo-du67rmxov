<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Você está offline — CRM Atomic</title>
    <meta name="theme-color" content="#0b1120" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1120;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #111c33;
        border: 1px solid #24324d;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #128c7e;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge svg {
        width: 32px;
        height: 32px;
        stroke: #ffffff;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin: 0 0 24px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #128c7e;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.7;
      }
      .small {
        font-size: 12px;
        margin-top: 16px;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 2l20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.55a11 11 0 0 1 3.5-2.3" />
          <path d="M19 12.55a11 11 0 0 0-3.5-2.3" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M22 8.82a15 15 0 0 0-4.17-2.65" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>Você está offline</h1>
      <p>
        Não foi possível conectar à internet. Os dados do CRM serão sincronizados assim que a
        conexão voltar — verifique o Wi-Fi ou os dados móveis do celular.
      </p>
      <button id="retry" type="button">Tentar novamente</button>
      <p class="small">Se o problema persistir, procure um local com sinal melhor.</p>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        var btn = this
        btn.disabled = true
        btn.textContent = 'Conectando...'
        fetch('/', { cache: 'no-store' })
          .then(function (res) {
            if (res.ok) {
              window.location.reload()
            } else {
              throw new Error('sem internet')
            }
          })
          .catch(function () {
            btn.disabled = false
            btn.textContent = 'Tentar novamente'
          })
      })
    </script>
  </body>
</html>
