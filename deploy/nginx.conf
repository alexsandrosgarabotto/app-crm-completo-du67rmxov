# ==============================================================================
# CONFIGURAÇÃO NGINX - CRM (Frontend SPA + Backend PocketBase)
#
# Substitua:
#   crm.seudominio.com -> pelo domínio/subdomínio do seu frontend
#   api.seudominio.com -> pelo domínio/subdomínio da sua API PocketBase
#   /var/www/crm/dist  -> pelo caminho onde os arquivos gerados pelo 'npm run build' foram copiados
#
# Salve este arquivo ou copie para /etc/nginx/sites-available/crm.conf
# e crie o link simbólico em /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: crm.seudominio.com (React SPA estático)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.seudominio.com;

    # Raiz dos arquivos estáticos compilados (resultado de 'npm run build')
    root /var/www/crm/dist;
    index index.html;

    # Suporte a SPA: Qualquer rota não encontrada no disco cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache eficiente para assets estáticos com hash no nome (Vite /assets)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bloquear arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limite padrão de upload no frontend
    client_max_body_size 50M;

    # Logs específicos do frontend
    access_log /var/log/nginx/crm_frontend_access.log;
    error_log /var/log/nginx/crm_frontend_error.log;
}

# ------------------------------------------------------------------------------
# 2. BACKEND: api.seudominio.com (Reverse Proxy para PocketBase em 127.0.0.1:8090)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com;

    # Permitir uploads maiores (anexos de notas fiscais, planilhas, comprovantes e fotos)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Headers necessários para o PocketBase identificar protocolo, IP real e domínio
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte para Server-Sent Events (SSE) e WebSockets em tempo real (pb.collection().subscribe)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Desativa buffering para SSE fluir instantaneamente
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Logs específicos do backend
    access_log /var/log/nginx/crm_api_access.log;
    error_log /var/log/nginx/crm_api_error.log;
}
